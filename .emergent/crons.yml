crons:
  - name: sync-subs
    description: "Sincroniza a diario el estado de las suscripciones de Stripe (renovaciones, impagos, cancelaciones)"
    cron: "0 8 * * *"
    endpoint: "{{BASE_URL}}/api/cron/sync-subscriptions"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
