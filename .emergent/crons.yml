crons:
  - name: sync-subs
    description: "Sincroniza a diario el estado de las suscripciones de Stripe (renovaciones, impagos, cancelaciones)"
    cron: "0 8 * * *"
    endpoint: "{{BASE_URL}}/api/cron/sync-subscriptions"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: reg-reminders
    description: "Recordatorio a quienes se registraron por autoservicio pero no verificaron su correo en 24h"
    cron: "0 */3 * * *"
    endpoint: "{{BASE_URL}}/api/cron/registration-reminders"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
